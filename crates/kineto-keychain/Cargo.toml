[package]
name = "kineto-keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
keyring-core = "1"
kineto-providers = { path = "../kineto-providers" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[lib]
path = "src/lib.rs"
