name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: linux-gate
    runs-on: anton
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.2"
      PUB_CACHE: /tmp/pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse Flutter
        id: flutter_sdk
        run: |
          flutter_root="/tmp/kineto-flutter-$FLUTTER_VERSION"
          test -x "$flutter_root/bin/flutter"
          test "$("$flutter_root/bin/flutter" --version | grep -m1 '^Flutter ' | awk '{print $2}')" = "$FLUTTER_VERSION"
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Environment snapshot
        id: env_snapshot
        working-directory: apps/kineto
        run: |
          printf 'HOME=%s\n' "$HOME"
          printf 'PATH=%s\n' "$PATH"
          printf 'CARGO_HOME=%s\n' "${CARGO_HOME-}"
          printf 'RUSTUP_HOME=%s\n' "${RUSTUP_HOME-}"
          command -v rustup || true
          command -v cargo || true
          flutter --version
          dart --version
          flutter pub get

      - name: Config inputs
        id: hook_config_inputs
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "native build cache configuration covers every Cargo manifest and pin"

      - name: Rust sources
        id: hook_rust_sources
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "native build cache tracks every Rust source in the workspace"

      - name: Toolchain pins
        id: hook_toolchain_pins
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "root and app Rust toolchain pins agree and do not preinstall targets"

      - name: Target parser
        id: hook_target_parser
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "installed rust targets are parsed from rustup whitespace output"

      - name: Missing toolchain plan
        id: hook_missing_toolchain
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup installs only the requested build target when missing"

      - name: Zero mutation plan
        id: hook_zero_mutation
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup is mutation-free when toolchain and target exist"

      - name: Target-only plan
        id: hook_target_only
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup adds only target when toolchain already exists"

      - name: Report gate outcomes
        if: always()
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS: ${{ toJSON(steps) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .forgejo/report-gates.py
