[package]
name = "kineto-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "kineto_native"
crate-type = ["staticlib", "cdylib"]

[features]
ownership-test-hooks = []

[dependencies]
kineto-core = { path = "../../../crates/kineto-core" }
kineto-jobs = { path = "../../../crates/kineto-jobs" }
kineto-llm = { path = "../../../crates/kineto-llm" }
kineto-plugins = { path = "../../../crates/kineto-plugins" }
kineto-project = { path = "../../../crates/kineto-project" }
kineto-providers = { path = "../../../crates/kineto-providers" }
serde_json = "1"

[dev-dependencies]
kineto-core = { path = "../../../crates/kineto-core", features = ["testing"] }
kineto-llm = { path = "../../../crates/kineto-llm", features = ["testing"] }
serde_json = "1"
