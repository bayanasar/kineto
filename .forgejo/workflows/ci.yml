name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: linux-gate
    runs-on: anton
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.2"
      FLUTTER_ARCHIVE_SHA256: "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185"
      PUB_CACHE: /tmp/pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        id: rust_toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v rustup
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Reuse Flutter 3.47.2
        id: flutter_sdk
        run: |
          flutter_root="/tmp/kineto-flutter-$FLUTTER_VERSION"
          if [ -x "$flutter_root/bin/flutter" ] &&              [ "$("$flutter_root/bin/flutter" --version | grep -m1 '^Flutter ' | awk '{print $2}')" = "$FLUTTER_VERSION" ]; then
            echo "reusing cached Flutter $FLUTTER_VERSION"
          else
            archive="/tmp/flutter-$FLUTTER_VERSION.tar.xz"
            rm -rf "$flutter_root" "$archive"
            mkdir -p "$flutter_root"
            curl --retry 3 --retry-all-errors -fsSL               "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"               -o "$archive"
            echo "$FLUTTER_ARCHIVE_SHA256  $archive" | sha256sum -c -
            tar --no-same-owner -xJf "$archive" -C "$flutter_root" --strip-components=1
            rm -f "$archive"
          fi
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Flutter toolchain
        id: flutter_toolchain
        run: |
          flutter config --no-analytics
          flutter --version
          dart --version

      - name: Pub get
        id: flutter_pub_get
        working-directory: apps/kineto
        run: flutter pub get

      - name: Hook inputs — config inputs
        id: hook_test_config_inputs
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "native build cache configuration covers every Cargo manifest and pin"

      - name: Hook inputs — Rust sources
        id: hook_test_rust_sources
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "native build cache tracks every Rust source in the workspace"

      - name: Hook inputs — toolchain pins
        id: hook_test_toolchain_pins
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "root and app Rust toolchain pins agree and do not preinstall targets"

      - name: Hook inputs — target parser
        id: hook_test_target_parser
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "installed rust targets are parsed from rustup whitespace output"

      - name: Hook inputs — missing toolchain
        id: hook_test_missing_toolchain
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup installs only the requested build target when missing"

      - name: Hook inputs — zero mutation
        id: hook_test_zero_mutation
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup is mutation-free when toolchain and target exist"

      - name: Hook inputs — target only
        id: hook_test_target_only
        if: always()
        working-directory: apps/kineto
        run: flutter test test/build_hook_inputs_test.dart --plain-name "rustup setup adds only target when toolchain already exists"

      - name: Report gate outcomes
        if: always()
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS: ${{ toJSON(steps) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .forgejo/report-gates.py
