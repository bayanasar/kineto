name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: linux-gate
    runs-on: anton
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.2"
      FLUTTER_ARCHIVE_SHA256: "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185"
      PUB_CACHE: /tmp/pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux build dependencies
        id: linux_deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1 && sudo -n true; then
            SUDO="sudo -n"
          else
            echo "runner must be root or provide passwordless sudo" >&2
            exit 1
          fi

          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libblkid-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            python3 \
            xz-utils

      - name: Rust toolchain from rust-toolchain.toml
        id: rust_toolchain
        run: |
          # Flutter build hooks keep HOME/PATH but drop RUSTUP_HOME/CARGO_HOME.
          # Prefer the runner image's preinstalled Rust by exposing it through
          # rustup's default homes; fall back to provisioning defaults only when
          # the image does not already contain the pinned toolchain + host target.
          image_rustup_home="${RUSTUP_HOME:-}"
          image_cargo_home="${CARGO_HOME:-}"
          default_rustup_home="$HOME/.rustup"
          default_cargo_home="$HOME/.cargo"

          if [ ! -e "$default_rustup_home" ] &&
             [ -n "$image_rustup_home" ] &&
             [ "$image_rustup_home" != "$default_rustup_home" ] &&
             [ -d "$image_rustup_home" ]; then
            ln -s "$image_rustup_home" "$default_rustup_home"
          fi
          if [ ! -e "$default_cargo_home" ] &&
             [ -n "$image_cargo_home" ] &&
             [ "$image_cargo_home" != "$default_cargo_home" ] &&
             [ -d "$image_cargo_home" ]; then
            ln -s "$image_cargo_home" "$default_cargo_home"
          fi

          export RUSTUP_HOME="$default_rustup_home"
          export CARGO_HOME="$default_cargo_home"
          export PATH="$CARGO_HOME/bin:$PATH"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

          hook_view_ok=false
          if [ -x "$CARGO_HOME/bin/rustup" ]; then
            hook_target_libdir="$(
              cd apps/kineto &&
              env -i HOME="$HOME" PATH="$PATH" RUSTUP_AUTO_INSTALL=0 \
                rustc --print target-libdir --target x86_64-unknown-linux-gnu 2>/dev/null || true
            )"
            if (cd apps/kineto &&
                env -i HOME="$HOME" PATH="$PATH" RUSTUP_AUTO_INSTALL=0 rustc --version >/dev/null 2>&1) &&
               [ -n "$hook_target_libdir" ] &&
               [ -d "$hook_target_libdir" ] &&
               rustfmt --version >/dev/null 2>&1 &&
               cargo clippy --version >/dev/null 2>&1; then
              hook_view_ok=true
              echo "reusing runner image Rust toolchain through default-home links"
            fi
          fi

          if [ "$hook_view_ok" != true ]; then
            # Do not mutate image-owned /usr/local homes through the temporary
            # links. Replace them with real default homes before provisioning.
            if [ -L "$default_rustup_home" ]; then
              rm "$default_rustup_home"
            fi
            if [ -L "$default_cargo_home" ]; then
              rm "$default_cargo_home"
            fi
            mkdir -p "$default_rustup_home" "$default_cargo_home"

            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            fi

            if ! RUSTUP_AUTO_INSTALL=0 rustup run 1.98.1 rustc --version >/dev/null 2>&1; then
              rustup toolchain install 1.98.1 \
                --profile minimal \
                --component rustfmt \
                --component clippy
            fi

            target_libdir="$(
              RUSTUP_AUTO_INSTALL=0 rustup run 1.98.1 rustc \
                --print target-libdir --target x86_64-unknown-linux-gnu 2>/dev/null || true
            )"
            if [ -z "$target_libdir" ] || [ ! -d "$target_libdir" ]; then
              rustup target add x86_64-unknown-linux-gnu --toolchain 1.98.1
            fi
          fi

          test -z "${RUSTUP_TOOLCHAIN:-}"
          rustup show active-toolchain
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

          # Resolve toolchain and target exactly as the build hook will.
          (
            cd apps/kineto
            env -i HOME="$HOME" PATH="$PATH" RUSTUP_AUTO_INSTALL=0 rustc --version
            target_libdir="$(
              env -i HOME="$HOME" PATH="$PATH" RUSTUP_AUTO_INSTALL=0 \
                rustc --print target-libdir --target x86_64-unknown-linux-gnu
            )"
            test -d "$target_libdir"
          )

      - name: Flutter 3.47.2
        id: flutter_sdk
        run: |
          test "$(uname -m)" = "x86_64"

          flutter_root="/tmp/kineto-flutter-$FLUTTER_VERSION"
          archive="/tmp/flutter-$FLUTTER_VERSION.tar.xz"
          rm -rf "$flutter_root" "$archive"
          mkdir -p "$flutter_root"

          curl --retry 3 --retry-all-errors -fsSL \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            -o "$archive"
          echo "$FLUTTER_ARCHIVE_SHA256  $archive" | sha256sum -c -
          tar --no-same-owner -xJf "$archive" -C "$flutter_root" --strip-components=1
          rm -f "$archive"

          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Flutter toolchain
        id: flutter_toolchain
        run: |
          flutter config --no-analytics
          actual_flutter="$(flutter --version | grep -m1 '^Flutter ' | awk '{print $2}')"
          test "$actual_flutter" = "$FLUTTER_VERSION"
          flutter precache --linux
          flutter --version
          dart --version

      - name: Rust dependencies
        id: rust_fetch
        run: cargo fetch --locked

      - name: Rust format
        id: rust_fmt
        run: cargo fmt --all -- --check

      - name: Rust locked metadata
        id: rust_metadata
        run: cargo metadata --offline --locked --format-version 1 >/dev/null

      - name: Rust workspace tests
        id: rust_tests
        run: cargo test --workspace --offline --locked

      - name: Rust clippy
        id: rust_clippy
        run: cargo clippy --workspace --all-targets --offline --locked -- -D warnings

      - name: Brand hard cut
        id: brand
        run: ./tool/check-brand-hard-cut.sh

      - name: Clean Flutter dependency resolution
        id: flutter_pub_get
        working-directory: apps/kineto
        run: |
          test ! -e pubspec_overrides.yaml
          lock_before="$(sha256sum pubspec.lock | awk '{print $1}')"
          flutter pub get
          lock_after="$(sha256sum pubspec.lock | awk '{print $1}')"
          test "$lock_before" = "$lock_after"
          git diff --exit-code -- pubspec.lock

      - name: Flutter analyze
        id: flutter_analyze
        working-directory: apps/kineto
        run: flutter analyze

      - name: Flutter tests
        id: flutter_tests
        working-directory: apps/kineto
        run: flutter test

      - name: Linux release build
        id: linux_build
        working-directory: apps/kineto
        run: flutter build linux --release

      - name: No checkout drift
        id: checkout_drift
        run: |
          drift="$(git status --porcelain --untracked-files=all)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            exit 1
          fi

      - name: Report gate outcomes
        if: always()
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS: ${{ toJSON(steps) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .forgejo/report-gates.py
