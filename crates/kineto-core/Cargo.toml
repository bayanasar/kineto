[package]
name = "kineto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
kineto-job-runtime = { path = "../kineto-job-runtime" }
kineto-jobs = { path = "../kineto-jobs" }
kineto-llm = { path = "../kineto-llm" }
kineto-project = { path = "../kineto-project" }
kineto-prompts = { path = "../kineto-prompts" }
kineto-provider-minimax = { path = "../kineto-provider-minimax" }
kineto-providers = { path = "../kineto-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
base64 = "0.23"
kineto-llm = { path = "../kineto-llm", features = ["testing"] }

[lib]
path = "src/lib.rs"
