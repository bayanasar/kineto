[package]
name = "kineto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kineto-job-runtime = { path = "../kineto-job-runtime" }
kineto-jobs = { path = "../kineto-jobs" }
kineto-llm = { path = "../kineto-llm" }
kineto-plugins = { path = "../kineto-plugins" }
kineto-project = { path = "../kineto-project" }
kineto-prompts = { path = "../kineto-prompts" }
kineto-provider-minimax = { path = "../kineto-provider-minimax" }
kineto-provider-gemini = { path = "../kineto-provider-gemini" }
kineto-providers = { path = "../kineto-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# A scripted language model for tests of code built on sessions.
testing = ["kineto-llm/testing"]

[dev-dependencies]
base64 = "0.23"
kineto-json-schema = { path = "../kineto-json-schema" }
kineto-llm = { path = "../kineto-llm", features = ["testing"] }

[lib]
path = "src/lib.rs"

[[test]]
name = "plugin_provider"
harness = false

[[test]]
name = "references"
harness = false
