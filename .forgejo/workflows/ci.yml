name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-gate:
    name: linux-gate
    runs-on: anton
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      FLUTTER_VERSION: "3.47.2"
      FLUTTER_ARCHIVE_SHA256: "447878859d01ca9bfdb99a85f245af07ed8a15fedcd9d189c4749e8e92d1f185"
      PUB_CACHE: /tmp/pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        id: rust_toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs               | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain

      - name: Flutter 3.47.2
        id: flutter_sdk
        run: |
          flutter_root="$HOME/.cache/kineto/flutter-$FLUTTER_VERSION"
          if [ -x "$flutter_root/bin/flutter" ] &&              [ "$("$flutter_root/bin/flutter" --version | grep -m1 '^Flutter ' | awk '{print $2}')" = "$FLUTTER_VERSION" ]; then
            echo "reusing cached Flutter $FLUTTER_VERSION"
          else
            archive="/tmp/flutter-$FLUTTER_VERSION.tar.xz"
            rm -rf "$flutter_root" "$archive"
            mkdir -p "$flutter_root"
            curl --retry 3 --retry-all-errors -fsSL               "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"               -o "$archive"
            echo "$FLUTTER_ARCHIVE_SHA256  $archive" | sha256sum -c -
            tar --no-same-owner -xJf "$archive" -C "$flutter_root" --strip-components=1
            rm -f "$archive"
          fi
          echo "$flutter_root/bin" >> "$GITHUB_PATH"

      - name: Environment + pub get
        id: env_snapshot
        working-directory: apps/kineto
        run: |
          printf 'HOME=%s\n' "$HOME"
          printf 'PATH=%s\n' "$PATH"
          printf 'CARGO_HOME=%s\n' "${CARGO_HOME-}"
          printf 'RUSTUP_HOME=%s\n' "${RUSTUP_HOME-}"
          command -v rustup || true
          command -v cargo || true
          flutter --version
          dart --version
          flutter pub get

      - name: Reproduce config-input test and publish output
        id: hook_config_inputs
        working-directory: apps/kineto
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          flutter test test/build_hook_inputs_test.dart             --plain-name "native build cache configuration covers every Cargo manifest and pin"             > /tmp/hook-config-inputs.log 2>&1
          rc=$?
          set -e

          python3 - "$rc" <<'PY'
          import json, os, pathlib, sys, urllib.request
          rc = int(sys.argv[1])
          log = pathlib.Path("/tmp/hook-config-inputs.log").read_text(errors="replace")
          tail = log[-12000:]
          body = (
              "## CI diagnostic: config-input test\n\n"
              f"HEAD: \`{os.environ['HEAD_SHA']}\`\n"
              f"exit: {rc}\n\n"
              "\`\`\`text\n" + tail + "\n\`\`\`"
          )
          data = json.dumps({"body": body}).encode()
          url = (
              f"{os.environ['SERVER_URL']}/api/v1/repos/"
              f"{os.environ['REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments"
          )
          req = urllib.request.Request(
              url, data=data, method="POST",
              headers={
                  "Authorization": f"token {os.environ['STATUS_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              response.read()
          PY

          cat /tmp/hook-config-inputs.log
          exit "$rc"

      - name: Report gate outcomes
        if: always()
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS: ${{ toJSON(steps) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .forgejo/report-gates.py
