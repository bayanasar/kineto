[package]
name = "kineto-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
testing = []

[dependencies]
kineto-jobs = { path = "../kineto-jobs" }
kineto-json-schema = { path = "../kineto-json-schema" }
kineto-providers = { path = "../kineto-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.0.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lib]
path = "src/lib.rs"
